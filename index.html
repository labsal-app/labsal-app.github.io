*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--f-body)}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:500}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .wm{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand b{font-family:var(--f-display);font-weight:500;font-size:24px;letter-spacing:-.015em}
.brand small{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status-dot.on{background:var(--ok)}
main{max-width:680px;margin:0 auto;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);cursor:pointer;font-weight:500}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:8px}

/* blocks */
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:21px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.row:first-child{border-top:0}
button.row:hover{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted)}
.row .r{text-align:right;white-space:nowrap}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-display);font-weight:500;font-size:21px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .h{font-size:12px;color:var(--muted)}
.kpi.main{grid-column:1/-1;background:var(--hero);border-color:var(--hero);color:var(--hero-ink)}
.kpi.main .label{color:var(--gold)}
.kpi.main .h{color:inherit;opacity:.75}
.kpi.main .v{font-size:32px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.pc{--pcol:var(--accent)}
.pc-calma{--pcol:var(--calma)} .pc-pies{--pcol:var(--pies)} .pc-recovery{--pcol:var(--recovery)}
.swatch{width:10px;height:10px;border-radius:3px;background:var(--pcol);flex:none}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prod-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--pcol) 14%,transparent),transparent 70%)}
.prod-h h3{font-size:20px;color:var(--pcol);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.prod-h .s{font-size:12.5px;color:var(--muted)}
.prod-b{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:460px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fact{display:flex;flex-direction:column;gap:2px;min-width:0}

<script>
(function(){
"use strict";
/* ---------- utilidades ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NF = {};
const nf = d => NF[d] || (NF[d] = new Intl.NumberFormat("es-AR",{maximumFractionDigits:d}));
const ARS = new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0});
const money = n => isFinite(n) ? ARS.format(Math.round(n)) : "—";
const num = (n,d=0) => isFinite(n) ? nf(d).format(n) : "—";
const qty = (q,u) => u === "g" ? (Math.abs(q) >= 1000 ? num(q/1000,2)+" kg" : num(q,1)+" g") : num(q,0)+" u";
const pct = n => isFinite(n) ? num(n*100,0)+"%" : "—";
const pad = n => String(n).padStart(2,"0");
const dkey = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => dkey(new Date());
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESES_L = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const fdate = s => { if(!s) return "—"; const [y,m,d] = s.slice(0,10).split("-"); return d+"/"+m+"/"+y; };
const ftime = iso => { if(!iso) return ""; const d = new Date(iso); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const fdur = sec => { sec = Math.max(0,Math.round(sec||0)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return (h? h+":"+pad(m) : m)+":"+pad(s); };
const fdurH = sec => { const m = Math.round((sec||0)/60); return m < 60 ? m+" min" : Math.floor(m/60)+" h "+pad(m%60)+" min"; };
const addMonths = (iso, m) => { const d = new Date(iso); d.setMonth(d.getMonth()+m); return dkey(d); };
const toN = v => { if (v === "" || v == null) return NaN; return Number(String(v).replace(",", ".")); };
const slug = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "item";

const CANALES = ["Tiendanube","WhatsApp / directo","Mercado Libre","Feria / local","Otro"];
const CATS = ["Envíos","Marketing y publicidad","Servicios (luz, gas, agua)","Equipamiento","Impuestos y monotributo","Habilitaciones (ANMAT)","Comisiones bancarias","Otros"];

/* ---------- estado ---------- */
const S = {
  db:null, noDb:false, ready:false, dl:null,
  insumos:[], productos:[], compras:[], lotes:[], ventas:[], gastos:[], ajustes:[], cfg:{}, proto:[],
  view:"inicio", mes:today().slice(0,7), stockTab:"insumos", movTab:"ventas",
  run:null, br:null
};
const COLS = ["insumos","productos","compras","lotes","ventas","gastos","ajustes"];
let writeQ = Promise.resolve();
function errMsg(e){
  const c = e && e.code;
  if (c === "invalid_argument") return "No se pudo guardar: tu acceso a esta app es solo de lectura.";
  if (c === "quota_exceeded") return "Se llenó el espacio de datos: "+(e.message||"");
  if (c === "revoked") return "Se perdió el acceso a los datos. Volvé a abrir la app.";
  return "No se pudo guardar. Revisá la conexión e intentá de nuevo.";
}
function write(fn, okMsg){
  if (!S.db){ toast("No se pudo abrir el almacenamiento del celu."); return Promise.resolve(false); }
  const p = writeQ.then(fn).then(() => { if (okMsg) toast(okMsg); return true; }, e => { toast(errMsg(e)); return false; });
  writeQ = p.then(()=>{}, ()=>{});
  return p;
}

/* ---------- cálculos ---------- */
const byId = (arr,id) => arr.find(x => x.id === id);
const ins = id => byId(S.insumos,id);
const prod = id => byId(S.productos,id);
const okLote = l => l.estado === "cerrado" || l.estado === "rechazado";

function costoIns(id){
  let c=0, m=0;
  for (const x of S.compras) if (x.insumoId === id && x.cant > 0){ c += x.cant; m += x.monto||0; }
  return c > 0 ? m/c : 0;
}
function stockIns(id){
  let s = 0;
  for (const x of S.compras) if (x.insumoId === id) s += x.cant||0;
  for (const l of S.lotes) if (okLote(l) && l.consumos && l.consumos[id]) s -= l.consumos[id];
  for (const a of S.ajustes) if (a.tipo === "insumo" && a.refId === id) s += a.cant||0;
  return s;
}
function stockProd(id){
  let s = 0;
  for (const l of S.lotes) if (l.estado === "cerrado" && l.productoId === id) s += l.unidades||0;
  for (const v of S.ventas) if (v.productoId === id) s -= v.cant||0;
  for (const a of S.ajustes) if (a.tipo === "producto" && a.refId === id) s += a.cant||0;
  return s;
}
function costoFormula(p){
  let t = 0, falta = false;
  for (const f of (p.formula||[])){ const c = costoIns(f.i); if (!c) falta = true; t += c*f.c; }
  return {total:t, falta};
}
function costoRealProd(id){
  let c=0,u=0;
  for (const l of S.lotes) if (l.estado === "cerrado" && l.productoId === id && l.unidades > 0){ c += l.costoMP||0; u += l.unidades; }
  return u > 0 ? c/u : NaN;
}
function costoUnit(p){ const r = costoRealProd(p.id); return isFinite(r) ? r : costoFormula(p).total; }
function puedoProducir(p){
  let max = Infinity, lim = null;
  for (const f of (p.formula||[])){
    if (!(f.c > 0)) continue;
    const s = Math.max(0, stockIns(f.i));
    const n = Math.floor(s / f.c + 1e-9);
    if (n < max){ max = n; lim = f.i; }
  }
  return {max: max === Infinity ? 0 : max, lim};
}
function faltantes(p, n){
  const out = [];
  for (const f of (p.formula||[])){
    const need = f.c*n, s = stockIns(f.i);
    if (need > s + 1e-9) out.push({i:f.i, need, s, falta:need - Math.max(0,s)});
  }
  return out;
}
function minimoEstado(i){
  const s = stockIns(i.id);
  if (s <= 0) return {cls:"bad", t:"Sin stock"};
  if (i.minimo > 0 && s < i.minimo) return {cls:"warn", t:"Bajo"};
  return {cls:"ok", t:"OK"};
}
function pasosDe(p){ return [...(S.proto||[]).map(x => ({...x, _proto:true})), ...(p.pasos||[])]; }
function nuevoCodigo(p, fechaIso){
  const base = (p.prefijo || p.id.toUpperCase()) + "-" + fechaIso.slice(0,4) + "-" + fechaIso.slice(5,7) + "-";
  let n = 0;
  for (const l of S.lotes) if ((l.codigo||"").startsWith(base)){ const k = parseInt(l.codigo.slice(base.length),10); if (k > n) n = k; }
  return base + pad(n+1);
}
function mesData(m){
  const v = S.ventas.filter(x => (x.fecha||"").startsWith(m));
  const ingresos = v.reduce((a,x) => a + x.cant*x.precio, 0);
  const comis = v.reduce((a,x) => a + (x.comision||0), 0);
  const cmv = v.reduce((a,x) => { const p = prod(x.productoId); return a + x.cant*(p ? costoUnit(p) : 0); }, 0);
  const compras = S.compras.filter(x => (x.fecha||"").startsWith(m) && !x.inicial).reduce((a,x) => a + (x.monto||0), 0);
  const gastos = S.gastos.filter(x => (x.fecha||"").startsWith(m)).reduce((a,x) => a + (x.monto||0), 0);
  const lotes = S.lotes.filter(l => okLote(l) && (l.fin||"").startsWith(m));
  const horas = lotes.reduce((a,l) => a + (l.duracionSeg||0), 0)/3600;
  const unidades = v.reduce((a,x) => a + x.cant, 0);
  return {ingresos, comis, cmv, compras, gastos, horas, unidades, lotes:lotes.length,
    caja: ingresos - comis - compras - gastos,
    ganancia: ingresos - comis - cmv - gastos};
}

/* ---------- toast / sheet ---------- */
let toastT;
function toast(msg){
  const r = $("#toast-root");
  r.innerHTML = '<div class="toast" role="status">'+esc(msg)+'</div>';
  clearTimeout(toastT); toastT = setTimeout(() => r.innerHTML = "", 3200);
}
function openSheet(title, html, mount){
  const r = $("#sheet-root");
  r.innerHTML = '<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="sheet-h"><h2>'+esc(title)+'</h2><button class="btn ghost sm" data-act="close-sheet" aria-label="Cerrar">Cerrar</button></div>'+html+'</div></div>';
  if (mount) mount($(".sheet", r));
  const f = $(".sheet input, .sheet select", r); if (f && !("ontouchstart" in window)) f.focus();
}
function closeSheet(){ $("#sheet-root").innerHTML = ""; if (pendingRender) render(); }

/* ---------- render ---------- */
let pendingRender = false, raf = 0;
function schedule(){
  const a = document.activeElement;
  if (S.view === "run" && S.run) return; /* el paso a paso se redibuja solo con sus propias acciones */
  if (a && $("#main").contains(a) && a.matches("input,select,textarea")) { pendingRender = true; return; }
  if ($("#sheet-root").firstChild) { pendingRender = true; }
  cancelAnimationFrame(raf); raf = requestAnimationFrame(render);
}
document.addEventListener("focusout", () => { if (pendingRender && S.view !== "run") setTimeout(() => { const a=document.activeElement; if (!(a && $("#main").contains(a) && a.matches("input,select,textarea"))) render(); }, 30); });

const ICONS = {
  inicio:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  producir:'<path d="M9 3h6M10 3v6L5 18a2 2 0 0 0 1.7 3h10.6A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.5 14h9"/>',
  stock:'<path d="M3 7l9-4 9 4-9 4z"/><path d="M3 12l9 4 9-4M3 17l9 4 9-4"/>',
  mov:'<path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/>',
  ajustes:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'
};
const TABS = [["inicio","Inicio"],["producir","Producir"],["stock","Stock"],["mov","Movimientos"],["ajustes","Ajustes"]];
function renderTabs(){
  $("#tabs").innerHTML = TABS.map(([k,l]) => '<button data-act="tab" data-v="'+k+'"'+(S.view===k||(S.view==="run"&&k==="producir")?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[k]+'</svg>'+l+'</button>').join("");
}
function render(){
  pendingRender = false;
  $("#dot").className = "status-dot" + (S.db && S.ready ? " on" : "");
  $("#dot").title = S.db ? (S.ready ? "Datos guardados en este celu" : "Cargando…") : "Sin datos";
  renderTabs();
  const m = $("#main");
  let h = "";
  if (!S.ready && !S.noDb) h = '<div class="card empty">Cargando datos de producción…</div>';
  else if (S.view === "run" && S.run) h = vRun();
  else if (S.view === "br" && S.br) h = vBR();
  else h = ({inicio:vInicio, producir:vProducir, stock:vStock, mov:vMov, ajustes:vAjustes}[S.view] || vInicio)();
  m.innerHTML = h;
  if (S.view === "run") tick();
}

function banners(){
  let h = "";

async function startLote(id, practica){
  const p = prod(id); if (!p) return;

  const ahora = new Date().toISOString();

  const run = {productoId:id, n, inicio:ahora, paso:0, ver:0, practica:!!practica, codigo: practica ? "PRÁCTICA" : nuevoCodigo(p, today()),
    log: pasos.map(() => ({done:false, at:null, checks:{}, vals:{}})), pesos:{}, operador:S.cfg.operador||"", timer:null};
  for (const f of (p.formula||[])) if ((ins(f.i)||{}).grupo !== "env") run.pesos[f.i] = +(f.c*n).toFixed(2);

function stepReady(st, lg, r, p){
  const items = st.items||[];
  for (let k=0;k<items.length;k++) if (!lg.checks[k]) return "Marcá todos los puntos del checklist.";
  for (const c of (st.campos||[])) if (c.req && (lg.vals[c.k] === undefined || lg.vals[c.k] === "")) return "Completá: "+c.l+".";
  if (st.tipo === "pesaje") for (const id in r.pesos) if (!(toN(r.pesos[id]) >= 0)) return "Cargá todos los pesos reales.";
  if (st.tipo === "cq" && !lg.vals.cq) return "Marcá si el control salió aprobado o rechazado.";
  if (st.tipo === "cierre"){ const u = toN(lg.vals.unidades); if (!(u >= 0)) return "Cargá las unidades obtenidas."; }
  return "";
}
function vRun(){
  const r = S.run, p = prod(r.productoId);
  if (!p) return '<div class="card empty">Producto no encontrado.</div>';
  const pasos = pasosDe(p), ix = Math.min(r.ver, pasos.length-1), st = pasos[ix], lg = r.log[ix];
  const doneN = r.log.filter(x => x.done).length;
  let h = '<div class="pc pc-'+esc(p.id)+'" style="display:flex;flex-direction:column;gap:14px">';
  h += '<div class="run-h"><div class="run-top"><span class="swatch"></span><b>'+esc(p.nombre)+'</b><span class="run-code">'+esc(r.codigo)+'</span>'+(r.practica?'<span class="chip warn">Práctica</span>':'')+'<span class="clock" id="clock" aria-label="Tiempo total">0:00</span></div>';
  h += '<div class="small muted">'+num(r.n)+' u × '+esc(p.presentacion||"")+' · iniciado '+ftime(r.inicio)+'</div>';

let audioCtx = null, tickI = 0;
function beep(){
  try { if (!audioCtx) return; const t = audioCtx.currentTime;
    [0,0.35,0.7].forEach(d => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(0.0001,t+d); g.gain.exponentialRampToValueAtTime(0.3,t+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.25); o.start(t+d); o.stop(t+d+0.3); });
  } catch(e){}
  try { navigator.vibrate && navigator.vibrate([300,150,300]); } catch(e){}
}
function tick(){
  const r = S.run; if (!r || S.view !== "run") return;
  const c = $("#clock"); if (c) c.textContent = fdur((Date.now() - new Date(r.inicio))/1000);
  const p = prod(r.productoId); if (!p) return;

  if (st && st.min && tv){

    if (t) rem = t.end ? Math.max(0,(t.end - Date.now())/1000) : t.rem;

    tb.className = "timer" + (t && t.end ? " run" : "") + (t && rem <= 0 ? " done" : "");
    if (btn) btn.textContent = t && t.end && rem > 0 ? "Pausar" : (t && rem <= 0 ? "Tiempo cumplido" : (t ? "Seguir" : "Iniciar "+num(st.min,1)+" min"));
    if (t && t.end && rem <= 0 && !t.beeped){ t.beeped = true; t.rem = 0; t.end = null; beep(); toast("Tiempo cumplido: "+st.t); tb.className = "timer done"; }
  }
}

async function cerrarLote(){
  const r = S.run, p = prod(r.productoId), pasos = pasosDe(p);
  const last = r.log[pasos.length-1];
  const cq = cqDe(r, pasos) || "aprobado";
  const unidades = cq === "rechazado" ? 0 : Math.max(0, Math.floor(toN(last.vals.unidades)||0));
  last.done = true; last.at = new Date().toISOString();
  const fin = last.at, dur = (new Date(fin) - new Date(r.inicio))/1000;
  const consumos = {};
  for (const f of (p.formula||[])){
    const i = ins(f.i); if (!i) continue;
    consumos[f.i] = i.grupo === "env" ? f.c*unidades : (toN(r.pesos[f.i])||0);
  }
  let costoMP = 0; for (const id in consumos) costoMP += consumos[id]*costoIns(id);
  const doc = loteDoc(r, {estado: cq==="rechazado" ? "rechazado" : "cerrado", fin, duracionSeg:Math.round(dur), unidades, consumos, costoMP, costoUnit: unidades ? costoMP/unidades : 0, cq, vence: addMonths(r.inicio, p.vidaUtil||24), notas: last.vals.notas||"", paso: pasos.length-1});
  wake(false);
  if (r.practica){
    S.run = null; S.view = "producir"; render();
    openSheet("Práctica terminada", '<div class="card br">'+dl([["Producto",p.nombre],["Duración",fdurH(dur)],["Unidades",num(unidades)],["Control de calidad",cq]])+'</div><div class="small muted">No se guardó nada ni se movió stock. Cuando quieras producir de verdad, usá "Iniciar lote".</div><button class="btn pri" data-act="close-sheet">Listo</button>');
    return;
  }
  const ok = await write(() => S.db.collection("lotes").doc(r.loteId).set(JSON.parse(JSON.stringify(doc))), cq==="rechazado" ? "Lote cerrado como rechazado." : "Lote cerrado. Stock actualizado.");
  if (!ok) return;
  S.br = r.loteId; S.run = null; S.view = "br"; render(); window.scrollTo(0,0);
}

async function save(filename, data){

  const touch = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
  if (touch && file && navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title:filename}); toast("Archivo listo."); return true; }
    catch(e){ if (e && e.name === "AbortError") return false; }
  }
  try {
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = filename; a.rel = "noopener"; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);

}
function csv(){

    case "prod-edit": closeSheet(); sheetProd(id); break;
    case "frow-add": { const sh = b.closest(".sheet"); const wrap = $("#frows", sh); const d = document.createElement("div"); d.innerHTML = sh._row({i:"",c:""}, sh._n++); wrap.appendChild(d.firstChild); break; }
    case "frow-del": b.closest("[data-frow]").remove(); break;
    case "mov-det": sheetMovDet(b.dataset.col, id); break;
    case "compra-edit": closeSheet(); sheetCompra(null, id); break;
    case "del-ask": $("#del-zone").innerHTML = '<div class="alert bad"><span class="ic">!</span><div>Se elimina el registro y el stock se recalcula. No se puede deshacer.</div></div><div class="btns"><button class="btn" data-act="close-sheet">Cancelar</button><button class="btn danger" data-act="del-go" data-col="'+b.dataset.col+'" data-id="'+esc(id)+'">Sí, eliminar</button></div>'; break;
    case "del-go": { const col = b.dataset.col; closeSheet(); write(() => S.db.collection(col).doc(id).delete(), "Eliminado."); break; }
    case "start": sheetStart(id); break;
    case "start-go": if (b.disabled) return; b.disabled = true; await startLote(id, false); break;
    case "start-prac": await startLote(id, true); break;
    case "resume": resume(id); break;
    case "br": S.br = id; S.view = "br"; render(); window.scrollTo(0,0); break;
    case "br-dl": { const l = byId(S.lotes, id); if (l) save("BatchRecord_"+l.codigo+".html", brHtml(l)); break; }
    case "brdel-ask": $("#brdel").innerHTML = '<div class="alert bad"><span class="ic">!</span><div>Se borra el lote y su batch record. El stock de insumos y de producto se recalcula como si nunca se hubiera hecho.</div></div><div class="btns"><button class="btn" data-act="br" data-id="'+esc(id)+'">Cancelar</button><button class="btn danger" data-act="brdel-go" data-id="'+esc(id)+'">Sí, eliminar lote</button></div>'; break;
    case "brdel-go": S.view = "producir"; S.br = null; render(); write(() => S.db.collection("lotes").doc(id).delete(), "Lote eliminado."); break;
    case "backup": doBackup(); break;
    case "restore": pickRestore(); break;
    case "restore-go": applyRestore(); break;
    case "install": doInstall(); break;
    case "export": save("LabSal_movimientos_"+today()+".csv", csv()); break;

    /* runner */
    case "ver": { const k = +v; if (k < 0 || !S.run || k > S.run.paso) return; S.run.ver = k; render(); window.scrollTo(0,0); break; }
    case "chk": { const r = S.run, lg = r.log[r.ver]; lg.checks[v] = !lg.checks[v]; refreshRun(); break; }
    case "chk-all": { const r = S.run, p = prod(r.productoId), st = pasosDe(p)[r.ver], lg = r.log[r.ver]; (st.items||[]).forEach((_,k) => lg.checks[k] = v === "1"); refreshRun(); break; }
    case "t-start": {
      try { if (!audioCtx){ const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); } if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); } catch(err){}
      const r = S.run, p = prod(r.productoId), st = pasosDe(p)[r.ver];
      let t = r.timer && r.timer.ix === r.ver ? r.timer : null;
      if (!t){ r.timer = {ix:r.ver, end:Date.now()+st.min*60000, rem:st.min*60}; }
      else if (t.end){ t.rem = Math.max(0,(t.end-Date.now())/1000); t.end = null; }
      else if (t.rem > 0){ t.end = Date.now()+t.rem*1000; }
      tick(); break;
    }
    case "t-reset": if (S.run){ S.run.timer = null; tick(); } break;
    case "cq": { const lg = S.run.log[S.run.ver]; lg.vals.cq = v; refreshRun(); break; }
    case "next": case "skip": {
      const r = S.run, p = prod(r.productoId), pasos = pasosDe(p), lg = r.log[r.ver], st = pasos[r.ver];
      if (a === "next" && stepReady(st, lg, r, p)) return;
      lg.done = true; lg.at = new Date().toISOString(); if (a === "skip") lg.omitido = true;
      let nx = r.ver + 1;
      if (st.tipo === "cq" && lg.vals.cq === "rechazado") nx = pasos.length - 1;
      r.paso = Math.max(r.paso, nx); r.ver = nx; r.timer = null;
      saveRun(); render(); window.scrollTo(0,0); break;
    }
    case "cerrar": { const r = S.run, p = prod(r.productoId), pasos = pasosDe(p); if (stepReady(pasos[r.ver], r.log[r.ver], r, p)) return; b.disabled = true; await cerrarLote(); break; }
    case "run-exit": { if (S.run && !S.run.practica) saveRun(); S.run = null; wake(false); S.view = "producir"; render(); break; }
    case "disc-ask": $("#disc").innerHTML = '<span class="small" style="color:var(--bad)">¿Descartar? No mueve stock.</span> <button class="btn sm danger" data-act="disc-go">Sí, descartar</button>'; break;
    case "disc-go": { const id2 = S.run.loteId; S.run = null; wake(false); S.view = "producir"; render(); write(() => S.db.collection("lotes").doc(id2).delete(), "Lote descartado."); break; }
  }
});
function refreshRun(){
  const y = window.scrollY; render(); window.scrollTo(0,y);
}
let runSaveT;
document.addEventListener("input", e => {
  const t = e.target, r = S.run;
  if (!r || S.view !== "run") return;
  if (t.dataset.peso){ r.pesos[t.dataset.peso] = t.value; }
  else if (t.dataset.campo){ r.log[r.ver].vals[t.dataset.campo] = t.value; }
  else if (t.dataset.run){ r[t.dataset.run] = t.value; }
  else return;
  const p = prod(r.productoId), st = pasosDe(p)[r.ver];
  const need = $("#need"), falta = stepReady(st, r.log[r.ver], r, p);
  if (need) need.textContent = r.log[r.ver].done ? "" : falta;
  const go = $('.run-foot .btn.pri'); if (go && (go.dataset.act === "next" || go.dataset.act === "cerrar")) go.disabled = !!falta;
  clearTimeout(runSaveT); runSaveT = setTimeout(saveRun, 1200);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#sheet-root").firstChild) closeSheet(); });

document.addEventListener("submit", async e => {
  const f = e.target; if (!f.dataset.form) return;
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(f));
  const now = new Date().toISOString();
  const k = f.dataset.form;
  if (k === "compra"){
    const i = ins(fd.insumoId); let cant = toN(fd.cant); const monto = toN(fd.monto);
    if (!i || !(cant > 0) || !(monto >= 0)) return toast("Revisá cantidad y monto.");
    if (fd.u === "kg") cant *= 1000;
    closeSheet();
    if (fd.editId){
      if (!byId(S.compras, fd.editId)) return toast("Esa compra ya no existe.");
      return write(() => S.db.collection("compras").doc(fd.editId).update({insumoId:i.id, cant, monto, fecha:fd.fecha||today(), proveedor:fd.proveedor||"", loteProv:fd.loteProv||"", inicial:!!fd.inicial, editado:now}), "Compra actualizada.");
    }
    write(() => S.db.collection("compras").add({insumoId:i.id, cant, monto, fecha:fd.fecha||today(), proveedor:fd.proveedor||"", loteProv:fd.loteProv||"", inicial:!!fd.inicial, creado:now}), "Compra guardada: +"+qty(cant,i.unidad)+" de "+i.nombre+".");
  }
  if (k === "venta"){
    const cant = Math.floor(toN(fd.cant)), precio = toN(fd.precio), com = toN(fd.comision)||0;
    if (!(cant > 0) || !(precio >= 0)) return toast("Revisá cantidad y precio.");
    closeSheet();
    write(() => S.db.collection("ventas").add({productoId:fd.productoId, cant, precio, comision:com, canal:fd.canal, cliente:fd.cliente||"", fecha:fd.fecha||today(), creado:now}), "Venta guardada.");
  }
  if (k === "gasto"){
    const monto = toN(fd.monto); if (!(monto > 0)) return toast("Cargá un monto.");
    closeSheet();
    write(() => S.db.collection("gastos").add({categoria:fd.categoria, monto, nota:fd.nota||"", fecha:fd.fecha||today(), creado:now}), "Gasto guardado.");
  }
  if (k === "ajuste"){
    const cant = toN(fd.cant); if (!isFinite(cant) || cant === 0) return toast("Cargá una cantidad distinta de cero.");
    closeSheet();
    write(() => S.db.collection("ajustes").add({tipo:fd.tipo, refId:fd.refId, cant, motivo:fd.motivo, fecha:fd.fecha||today(), creado:now}), "Ajuste guardado.");
  }
  if (k === "insumo"){
    const nombre = (fd.nombre||"").trim(); if (!nombre) return toast("Poné un nombre.");
    const data = {nombre, grupo:fd.grupo||"mp", minimo:toN(fd.minimo)||0, proveedor:fd.proveedor||""};
    let id = fd.id;
    if (!id){ id = slug(nombre); let n = 2; while (ins(id)) id = slug(nombre)+"-"+(n++); data.unidad = fd.unidad||"g"; closeSheet(); write(() => S.db.collection("insumos").doc(id).set(data), "Insumo creado."); }
    else { closeSheet(); write(() => S.db.collection("insumos").doc(id).update(data), "Insumo actualizado."); }
  }
  if (k === "prod"){
    const fi = [...f.querySelectorAll('[name="fi"]')].map(x => x.value), fc = [...f.querySelectorAll('[name="fc"]')].map(x => toN(x.value));
    const formula = fi.map((i,ix) => ({i, c:fc[ix]})).filter(x => x.i && x.c > 0);
    const data = {precio:toN(fd.precio)||0, vidaUtil:Math.floor(toN(fd.vidaUtil))||24, prefijo:(fd.prefijo||"").trim().toUpperCase()||fd.id.toUpperCase(), pesoNeto:toN(fd.pesoNeto)||0, formula};
    closeSheet(); write(() => S.db.collection("productos").doc(fd.id).update(data), "Producto actualizado.");
  }
  if (k === "cfg"){
    const com = {}; CANALES.forEach((c,ix) => { const n = toN(fd["com-"+ix]); if (isFinite(n)) com[c] = n; });
    const data = {operador:(fd.operador||"").trim(), valorHora:toN(fd.valorHora)||0, com};
    f.querySelector("button[type=submit]").blur();
    write(() => S.db.doc("config/general").set(data), "Configuración guardada.");
  }
});

/* ---------- base local: los datos viven en este celu (reemplaza la base de Claude) ---------- */
const LS_KEY = "labsal-datos-v1";
const LS_COPIA = "labsal-ultima-copia";
let LOCAL = null;
function makeLocalDb(){
  if (LOCAL) return LOCAL;
  const test = "__labsal_test__"; localStorage.setItem(test, "1"); localStorage.removeItem(test);
  let store;
  try { store = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch(e){ store = null; }
  if (!store || typeof store !== "object") store = {};
  const listeners = new Set();
  const clone = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));
  const col = n => (store[n] = store[n] || {});
  const rid = () => { const c = "abcdefghijklmnopqrstuvwxyz0123456789"; let s = ""; for (const b of crypto.getRandomValues(new Uint8Array(20))) s += c[b % 36]; return s; };
  const notify = () => setTimeout(() => { for (const l of Array.from(listeners)) { try { l(); } catch(e){ console.error(e); } } }, 0);
  const commit = fn => new Promise((res, rej) => {
    const antes = JSON.stringify(store);
    try { fn(); localStorage.setItem(LS_KEY, JSON.stringify(store)); res(); notify(); }
    catch(e){
      store = JSON.parse(antes);
      const quota = e && (e.name === "QuotaExceededError" || e.code === 22);
      rej(quota ? Object.assign(new Error("el almacenamiento del celu está lleno"), {code:"quota_exceeded"}) : e);
    }
  });
  const docRef = (c, id) => ({
    id, path: c + "/" + id,
    set: d => commit(() => { col(c)[id] = clone(d); }),
    update: d => commit(() => {
      if (!col(c)[id]) throw Object.assign(new Error("No existe el registro"), {code:"not_found"});
      Object.assign(col(c)[id], clone(d));
    }),
    delete: () => commit(() => { delete col(c)[id]; }),
    get: async () => { const v = col(c)[id]; return {id, exists: !!v, data: () => clone(v)}; },
    onSnapshot(cb){
      const fire = () => { const v = col(c)[id]; cb({id, exists: !!v, data: () => clone(v)}); };
      listeners.add(fire); setTimeout(fire, 0); return () => listeners.delete(fire);
    }
  });
  const colRef = c => ({
    doc: id => docRef(c, id || rid()),
    add: d => { const id = rid(); return docRef(c, id).set(d).then(() => docRef(c, id)); },
    onSnapshot(cb){
      const fire = () => { const o = col(c); const docs = Object.keys(o).map(id => ({id, exists:true, data: () => clone(o[id])})); cb({docs, size: docs.length, empty: !docs.length}); };
      listeners.add(fire); setTimeout(fire, 0); return () => listeners.delete(fire);
    }
  });
  LOCAL = {
    collection: colRef,
    doc: path => { const [c, id] = String(path).split("/"); return docRef(c, id); },
    dump: () => clone(store),
    replaceAll: datos => commit(() => { store = clone(datos); }),
    vacio: () => !Object.values(store).some(o => o && Object.keys(o).length)
  };
  window.addEventListener("storage", e => {
    if (e.key !== LS_KEY) return;
    try { store = JSON.parse(e.newValue || "{}") || {}; } catch(err){ store = {}; }
    notify();
  });
  return LOCAL;
}

/* ---------- copias de seguridad ---------- */
const lastCopia = () => { try { return localStorage.getItem(LS_COPIA) || ""; } catch(e){ return ""; } };
const hayDatos = () => S.insumos.length || S.productos.length || S.compras.length || S.lotes.length;
function backupBanner(){
  if (!S.ready || S.noDb || !hayDatos() || S.view === "run" || S.view === "ajustes") return "";
  const u = lastCopia();
  if (u && (Date.now() - new Date(u).getTime()) < 7 * 864e5) return "";
  const txt = u ? "Hace más de una semana que no hacés una copia de seguridad." : "Todavía no hiciste ninguna copia de seguridad.";
  return '<div class="alert info"><span class="ic">i</span><div style="flex:1">'+txt+' Los datos están guardados solo en este celu.</div><button class="btn sm pri" data-act="backup">Hacer copia</button></div>';
}
function backupCard(){
  const u = lastCopia();
  let h = '<section class="sec"><div class="sec-h"><h2>Copia de seguridad</h2></div><div class="card" style="display:flex;flex-direction:column;gap:10px">';
  h += '<div class="small muted">Los datos se guardan solo en este celu. Si se borran los datos del navegador o cambiás de teléfono, se pierden. Hacé una copia cada semana y guardala en Drive o mandátela por WhatsApp.</div>';
  h += '<div class="small">Última copia: <b>'+(u ? fdate(u.slice(0,10))+' '+ftime(u) : 'nunca')+'</b></div>';
  h += '<div class="btns"><button class="btn pri" data-act="backup">Descargar copia</button><button class="btn" data-act="restore">Restaurar copia</button></div>';
  h += '<input type="file" id="restore-file" accept=".json,application/json" hidden></div></section>';
  if (!esStandalone()){
    h += '<section class="sec"><div class="sec-h"><h2>Instalar en el celu</h2></div><div class="card" style="display:flex;flex-direction:column;gap:10px">';
    h += '<div class="small muted">Instalada se abre como cualquier app, a pantalla completa y sin internet. En Android: menú ⋮ del navegador → <b>Instalar app</b> o <b>Agregar a la pantalla principal</b>. En iPhone, desde Safari: botón Compartir → <b>Agregar a inicio</b>.</div>';
    if (installEvt) h += '<button class="btn pri" data-act="install">Instalar LabSal</button>';
    h += '</div></section>';
  }
  return h;
}
async function doBackup(){
  const datos = LOCAL ? LOCAL.dump() : {};
  const now = new Date();
  const payload = {app:"LabSal", formato:1, exportado: now.toISOString(), datos};
  const nombre = "LabSal_copia_"+dkey(now)+"_"+pad(now.getHours())+pad(now.getMinutes())+".json";
  const ok = await save(nombre, JSON.stringify(payload, null, 1));
  if (ok){ try { localStorage.setItem(LS_COPIA, now.toISOString()); } catch(e){} render(); }
}
function pickRestore(){
  let inp = $("#restore-file");
  if (!inp){ inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json"; inp.hidden = true; inp.id = "restore-file"; document.body.appendChild(inp); }
  inp.value = "";
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    let obj = null;
    try { obj = JSON.parse(await f.text()); } catch(e){}
    const d = obj && obj.app === "LabSal" && obj.datos && typeof obj.datos === "object" ? obj.datos : null;
    if (!d) return toast("Ese archivo no es una copia de LabSal.");
    S.pendingRestore = obj;
    const n = k => d[k] ? Object.keys(d[k]).length : 0;
    const filas = [["Insumos","insumos"],["Productos","productos"],["Compras","compras"],["Lotes","lotes"],["Ventas","ventas"],["Gastos","gastos"],["Ajustes de stock","ajustes"]]
      .map(([l,k]) => '<tr><td>'+l+'</td><td style="text-align:right"><b>'+n(k)+'</b></td></tr>').join("");
    const reemplaza = LOCAL && !LOCAL.vacio();
    openSheet("Restaurar copia",
      '<div class="small muted">Copia del '+esc(fdate(String(obj.exportado||"").slice(0,10)))+(obj.exportado?' '+esc(ftime(obj.exportado)):'')+'</div>'+
      '<table style="width:100%;border-collapse:collapse;margin:8px 0">'+filas+'</table>'+
      (reemplaza ? '<div class="alert bad"><span class="ic">!</span><div>Se reemplazan todos los datos que hay ahora en este celu por los de la copia. No se puede deshacer. Si dudás, descargá antes una copia de lo actual.</div></div>' : '')+
      '<div class="btns"><button class="btn" data-act="close-sheet">Cancelar</button><button class="btn pri" data-act="restore-go">Restaurar</button></div>');
  };
  inp.click();
}
async function applyRestore(){
  const obj = S.pendingRestore; S.pendingRestore = null;
  if (!obj || !LOCAL) return closeSheet();
  closeSheet();
  try {
    await LOCAL.replaceAll(obj.datos);
    try { localStorage.setItem(LS_COPIA, new Date().toISOString()); } catch(e){}
    S.view = "inicio"; toast("Copia restaurada.");
  } catch(e){ toast(errMsg(e)); }
}

/* ---------- instalación ---------- */
let installEvt = null;
const esStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (S.view === "ajustes") render(); });
window.addEventListener("appinstalled", () => { installEvt = null; toast("LabSal quedó instalada."); if (S.view === "ajustes") render(); });
async function doInstall(){
  if (!installEvt) return toast("Usá el menú del navegador para instalarla.");
  installEvt.prompt();
  try { await installEvt.userChoice; } catch(e){}
  installEvt = null; render();
}

/* ---------- arranque ---------- */
async function boot(){
  render();
  let db = null;
  try { db = makeLocalDb(); } catch(e){ db = null; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  if (!db){ S.noDb = true; S.ready = true; render(); return; }
  S.db = db;
  const pend = new Set([...COLS, "cfg", "proto"]);
  const done = k => { if (pend.delete(k) && !pend.size) S.ready = true; schedule(); };
  const onErr = k => err => { if (err && err.code !== "revoked") toast("No se pudieron leer los datos ("+k+")."); done(k); };
  for (const c of COLS) db.collection(c).onSnapshot(snap => { S[c] = snap.docs.map(d => Object.assign({id:d.id}, d.data())); done(c); }, onErr(c));
  db.doc("config/general").onSnapshot(s => { S.cfg = s.exists ? s.data() : {}; done("cfg"); }, onErr("cfg"));
  db.doc("config/protocolo").onSnapshot(s => { S.proto = s.exists ? (s.data().pasos || []) : []; done("proto"); }, onErr("proto"));
}
boot();
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
})();
</script>
